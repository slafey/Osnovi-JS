<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Дата</title>
        <link href="style.css" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <form>
            <select id='day'>
                <option value="смелый">1</option>
                <option value="умный">2</option>
                <option value="добрый">3</option>
                <option value="спокойный">4</option>
                <option value="энергичный">5</option>
                <option value="мечтательный">6</option>
                <option value="уверенный">7</option>
                <option value="веселый">8</option>
                <option value="загадочный">9</option>
                <option value="настойчивый">10</option>
                <option value="вежливый">11</option>
                <option value="решительный">12</option>
                <option value="творческий">13</option>
                <option value="усидчивый">14</option>
                <option value="злой">15</option>
                <option value="осторожный">16</option>
                <option value="активный">17</option>
                <option value="чувствительный">18</option>
                <option value="авантюрный">19</option>
                <option value="рассудительный">20</option>
                <option value="терпеливый">21</option>
                <option value="эмоциональный">22</option>
                <option value="трудолюбивый">23</option>
                <option value="оптимистичный">24</option>
                <option value="мудрый">25</option>
                <option value="отзывчивый">26</option>
                <option value="спонтанный">27</option>
                <option value="вдумчивый">28</option>
                <option value="скромный">29</option>
                <option value="амбициозный">30</option>
                <option value="находчивый">31</option>
            </select>
            <select id='month'>
                <option value="синий">Январь</option>
                <option value="белый">Февраль</option>
                <option value="зеленый">Март</option>
                <option value="голубой">Апрель</option>
                <option value="желтый">Май</option>
                <option value="фиолетовый">Июнь</option>
                <option value="красный">Июль</option>
                <option value="салатовый">Август</option>
                <option value="коричневый">Сентябрь</option>
                <option value="оранжевый">Октябрь</option>
                <option value="серый">Ноябрь</option>
                <option value="черный">Декабрь</option>
            </select>
            <select id='year'>
                <option value="бык">1997</option>
                <option value="тигр">1998</option>
                <option value="заяц">1999</option>
                <option value="дракон">2000</option>
                <option value="змея">2001</option>
                <option value="лошадь">2001</option>
                <option value="коза">2003</option>
                <option value="обезьяна">2004</option>
                <option value="петух">2005</option>
                <option value="собака">2006</option>
                <option value="свинья">2007</option>
            </select>
        </form>
        <div id="result"></div>
        <script src="script.js"></script>
    </body>

</html>
